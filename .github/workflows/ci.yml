name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check dist/ matches the source
        run: |
          npm run build
          git diff --exit-code -- dist || { echo "::error::dist/ is out of date. Run 'npm run build' and commit dist/."; exit 1; }

  self-scan:
    # Runs this repository's own GitHub Action on itself, exactly as users would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: DPDP Ready scan
        uses: ./
        with:
          fail-on: high
